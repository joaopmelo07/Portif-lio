<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contatos João Melo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
     <link rel="icon" type="image/png" href="icon.png">
</head>
<header>
    Contatos João Melo - Fale Comigo!
     <nav>
        <a href='index.html'>Início</a>
        <a href='Projetos.html'>Projetos</a>
        <a href='Sobre.html'>Sobre</a>
        </nav>
</header>
<body>
    <main>
        <h1>Contatos João Melo: Fale Comigo!</h1>
        <form>
            <p>
                <label for="nome"><strong>Nome:</strong></label>
                <input type="text" id="nome" name="nome" required>
            </p>
            <p>
                <label for="email"><strong>Email:</strong></label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="assunto"><strong>Assunto:</strong></label>
                <select id="assunto" name="assunto">
                    <option value="Local">Local</option>
                    <option value="Serviços">Serviços</option>
                    <option value="Agenda">Agendas</option>
                </select> 
            </p>
            <p>
                <label for="tel"><strong>Telefone:</strong></label>
                <input type="tel" id="tel" name="tel">
            </p>
            <p>
                <label for="mensagem"><strong>Mensagem:</strong></label>
                <textarea id="Mensagem" name="Mensagem"></textarea>
            </p>
            <button type="submit">Enviar</button>
    
        </form>

        <section>
            <table class="table1">
                <caption>Dias e Horários Viáveis para o Atendimento</caption>
                <tr>
                    <th>Dias Possíveis</th><th>Horários</th><th>Assunto</th>
                </tr>  

                <tr>
    <td>Sexta-Feira</td>
    <td>16:00h até 16:30</td>
    <td>A Combinar</td>
                </tr>
            </table>
        </section>
    </main>
    <footer>
    2026 - João Melo
</footer>
<script src="js/script.js"></script>
</body>
